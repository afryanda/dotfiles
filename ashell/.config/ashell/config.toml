position = "Top"

[modules]
left = [ "Workspaces", "Updates" ]
center = [ "WindowTitle" ]
right = [ "Tray", "SystemInfo", [ "Privacy", "Settings" ], "Clock" ]

# ...
[[CustomModule]]
name = "Calendar"
icon = ""
command = "zenity --calendar --title=\"Calendar\""

[clock]
format = "󰥔 %H:%M"

[updates]
check_cmd = "paru -Qua"
update_cmd = 'ghostty -e bash -c "paru; echo Done - Press enter to exit; read" &'

[appearance]
font_name = "CaskaydiaCove Nerd Font"
scale_factor = 1
style = "Solid"
opacity = 1

# tokyonight
primary_color = "#7aa2f7"
success_color = "#9ece6a"
text_color = "#a9b1d6"

workspace_colors = [ "#7aa2f7", "#9ece6a" ]

[appearance.danger_color]
base = "#f7768e"
weak = "#e0af68"

[appearance.background_color]
base = "#1a1b26"
weak = "#24273a"
strong = "#414868"

[appearance.secondary_color]
base = "#0c0d14"

[system_info]
indicators = [ "Cpu", "Memory", "Temperature" ]
